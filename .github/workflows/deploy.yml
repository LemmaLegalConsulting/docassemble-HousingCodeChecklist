name: Deploy UpToCode to GBLS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-uptocode-gbls-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production credential is configured
        env:
          API_KEY: ${{ secrets.DOCASSEMBLE_PRODUCTION_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Set the DOCASSEMBLE_PRODUCTION_API_KEY repository secret for interviews.gbls.org."
            exit 1
          fi
      - name: Deploy UpToCode to interviews.gbls.org
        uses: SuffolkLITLab/ALActions/da_package@main
        with:
          SERVER_URL: "https://interviews.gbls.org"
          DOCASSEMBLE_DEVELOPER_API_KEY: ${{ secrets.DOCASSEMBLE_PRODUCTION_API_KEY }}
          GITHUB_URL: "https://github.com/${{ github.repository }}"
          GITHUB_BRANCH: "main"
